<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#174238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>321系統神學</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<style>
:root{
  --ink:#20242B; --ink2:#4A5260; --ink3:#79828F;
  --bg:#FAF8F3; --card:#FFFFFF; --line:#E4DFD4;
  --p1:#1E3A5F; --p2:#1F4D3D; --p3:#8B5E1A;
  --accent:var(--p1);
  --warn:#B8860B;
  --fs:22px; --lh:1.9;
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:var(--lh);
  letter-spacing:.03em; -webkit-text-size-adjust:100%;
  padding-bottom:calc(78px + var(--safe-b));
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* ---------- 頁首 ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(250,248,243,.94);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.top h1{font-family:var(--serif);font-size:.92em;margin:0;font-weight:700;letter-spacing:.06em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:.8em;
  border:1px solid var(--line);background:var(--card);flex:none}
.iconbtn:active{background:#EFEAE0}
.iconbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- 分頁列 ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);display:flex}
.tabs button{flex:1;padding:10px 2px 12px;font-size:.62em;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.08em}
.tabs button b{font-family:var(--serif);font-size:1.5em;font-weight:600;line-height:1}
.tabs button.on{color:var(--accent)}

/* ---------- 通用 ---------- */
.sect{padding:22px 0 8px}
.eyebrow{font-size:.62em;letter-spacing:.28em;color:var(--ink3);margin:0 0 6px}
h2.big{font-family:var(--serif);font-size:1.35em;font-weight:700;margin:0 0 14px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:0 0 14px}
.muted{color:var(--ink3);font-size:.76em;line-height:1.7}
.bigbtn{display:block;width:100%;background:var(--accent);color:#fff;border-radius:20px;
  padding:22px 20px;text-align:left;box-shadow:0 6px 20px rgba(30,58,95,.18)}
.bigbtn small{display:block;opacity:.75;font-size:.6em;letter-spacing:.2em;margin-bottom:6px}
.bigbtn b{font-family:var(--serif);font-size:1.05em;font-weight:600;line-height:1.5}
.pill{display:inline-block;font-size:.58em;letter-spacing:.14em;padding:3px 10px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink3);vertical-align:middle}
.pill.A{background:var(--p1);color:#fff;border-color:var(--p1)}
.pill.B{color:var(--p1);border-color:var(--p1)}
.pill.C{color:var(--ink3);border-style:dashed}

/* ---------- 課程列表 ---------- */
.partbar{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;padding-bottom:8px;
  border-bottom:2px solid var(--accent)}
.partbar b{font-family:var(--serif);font-size:1.1em}
.partbar span{font-size:.68em;color:var(--ink3)}
.row{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left}
.row .num{font-family:var(--serif);font-size:1.15em;font-weight:700;color:var(--accent);
  min-width:2.1em;text-align:center;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:.9em;line-height:1.5}
.row .t span{display:block;font-size:.66em;color:var(--ink3);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 進度環 ---------- */
.ring{flex:none;width:44px;height:44px}
.ring circle{fill:none;stroke-width:5}
.ringbig{width:120px;height:120px;margin:0 auto 6px;display:block}
.ringbig circle{fill:none;stroke-width:9}

/* ---------- 深度切換 ---------- */
.depth{display:flex;gap:6px;background:#EFEAE0;padding:5px;border-radius:16px;margin:14px 0 4px}
.depth button{flex:1;padding:11px 4px;border-radius:12px;font-size:.68em;letter-spacing:.06em;color:var(--ink2)}
.depth button.on{background:var(--card);color:var(--accent);font-weight:700;
  box-shadow:0 2px 6px rgba(0,0,0,.07)}
.depthnote{font-size:.62em;color:var(--ink3);text-align:center;margin:2px 0 14px;letter-spacing:.08em}

/* ---------- 內文 ---------- */
.body{font-size:1em}
.body p,.body .pp{margin:0 0 1.05em}
.body .pp>ul:last-child,.body .pp>.tw:last-child{margin-bottom:0}
.body h4{font-family:var(--serif);font-size:1em;font-weight:700;color:var(--accent);
  margin:1.5em 0 .5em;padding-left:12px;border-left:4px solid var(--accent)}
.body ul{margin:0 0 1.05em;padding-left:1.15em}
.body li{margin:0 0 .6em}
.body strong{font-weight:700}
.body .quote{display:block;margin:.7em 0;padding:12px 16px;background:#F2EFE7;border-left:4px solid var(--p3);
  border-radius:0 10px 10px 0;font-size:.94em}
.body .vref{display:block;font-family:var(--serif);font-weight:700;color:var(--accent);margin-bottom:2px}
.body .vtext{display:block;padding-left:14px;border-left:3px solid var(--line);color:var(--ink2);font-size:.94em}
.body a.lx{color:var(--p3);font-weight:700;border-bottom:1px dashed var(--p3);white-space:nowrap}
.body a.vs{color:var(--accent);border-bottom:1px solid rgba(30,58,95,.28);white-space:nowrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:1em -20px;padding:0 20px}
.body table{border-collapse:collapse;min-width:100%;font-size:.8em;line-height:1.65}
.body th,.body td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
.body th{background:#EDF1F6;font-weight:700;white-space:nowrap}
.body pre.ascii,.body pre.map{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.6em;line-height:1.6;
  background:#F2EFE7;padding:14px;border-radius:12px;overflow-x:auto;white-space:pre;margin:1em 0}
.body pre.map{background:#EDF1F6}

/* ---------- 教師本區塊 ---------- */
.blk{border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:10px;overflow:hidden}
.blk>summary{list-style:none;padding:15px 18px;display:flex;gap:11px;align-items:center;cursor:pointer}
.blk>summary::-webkit-details-marker{display:none}
.blk>summary .bn{font-family:var(--serif);font-weight:700;color:var(--accent);font-size:.8em;
  min-width:3.4em;flex:none;font-variant-numeric:tabular-nums}
.blk>summary .bh{flex:1;font-size:.82em;font-weight:600;line-height:1.5}
.blk>summary .ar{color:var(--ink3);font-size:.7em}
.blk[open]>summary{border-bottom:1px solid var(--line);background:#FBF9F5}
.blk .inner{padding:16px 18px 4px}

/* ---------- 八大步驟 ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.step{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:var(--card)}
.step b{display:block;font-family:var(--serif);font-size:1.05em;color:var(--ink3)}
.step span{display:block;font-size:.56em;letter-spacing:.06em;color:var(--ink3);margin-top:2px}
.step.done{background:var(--accent);border-color:var(--accent)}
.step.done b,.step.done span{color:#fff}

/* ---------- 彈出層 ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(20,24,30,.42);display:none;
  align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .inner{background:var(--bg);width:100%;max-width:760px;max-height:82vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:8px 18px calc(28px + var(--safe-b))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 14px}
.lxword{font-family:var(--serif);font-size:1.5em;line-height:1.4;margin:0 0 2px}
.lxcode{font-size:.62em;letter-spacing:.14em;color:var(--p3);font-weight:700}

/* ---------- 表單 ---------- */
textarea,input[type=text]{width:100%;font:inherit;font-size:.85em;padding:12px 14px;border:1px solid var(--line);
  border-radius:14px;background:var(--card);color:var(--ink);resize:vertical}
.btn{display:inline-block;padding:13px 20px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);font-size:.76em;letter-spacing:.06em}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* ---------- 小組現場 ---------- */
.live{position:fixed;inset:0;z-index:90;background:#12161C;color:#F3EFE6;display:none;
  flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + var(--safe-b))}
.live.on{display:flex}
.live .lvbar{height:6px;background:#2A313B;border-radius:3px;overflow:hidden;margin-bottom:18px}
.live .lvbar i{display:block;height:100%;background:#C9A227;transition:width .4s}
.live .lvbody{flex:1;overflow-y:auto;font-size:1.5em;line-height:1.75;font-family:var(--serif)}
.live .lvbody .note{font-family:var(--sans);font-size:.5em;line-height:1.7;background:#3A3016;color:#F0DFA8;
  border-left:4px solid #C9A227;padding:14px 16px;border-radius:0 12px 12px 0;margin-top:22px}
.live .lvfoot{display:flex;gap:10px;align-items:center;margin-top:16px}
.live .lvfoot .btn{white-space:nowrap;padding:13px 14px;font-size:.66em}
.live .lvfoot .btn{background:#1D232C;border-color:#2A313B;color:#F3EFE6}
.live .clock{font-family:var(--serif);font-size:1.1em;min-width:3.4em;flex:none;font-variant-numeric:tabular-nums}

/* ---------- 繁殖卡 ---------- */
.tcard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:0 0 14px}
.tcard .th{background:var(--accent);color:#fff;padding:22px 22px 20px}
.tcard .th small{display:block;font-size:.56em;letter-spacing:.24em;opacity:.72;margin-bottom:8px}
.tcard .th b{font-family:var(--serif);font-size:1.18em;font-weight:700;line-height:1.5}
.tcard .tb{padding:20px 22px 4px}
.tcard ol{margin:0;padding:0;list-style:none;counter-reset:tl}
.tcard ol li{counter-increment:tl;position:relative;padding-left:2.1em;margin:0 0 1em;font-size:.92em;line-height:1.75}
.tcard ol li::before{content:counter(tl);position:absolute;left:0;top:.05em;font-family:var(--serif);
  font-weight:700;color:var(--accent);font-size:1.05em}
.tcard .tv{margin:4px 0 18px;padding:14px 18px;background:#F2EFE7;border-left:4px solid var(--p3);
  border-radius:0 12px 12px 0}
.tcard .tv p{margin:0;font-family:var(--serif);font-size:.98em;line-height:1.7}
.tcard .tv span{display:block;text-align:right;font-size:.68em;color:var(--ink3);margin-top:6px}
.tcard .tq{border-top:1px solid var(--line);padding:18px 22px 22px;margin:0 -22px}
.tcard .tq small{display:block;font-size:.56em;letter-spacing:.24em;color:var(--ink3);margin-bottom:8px}
.tcard .tq p{margin:0;font-size:.94em;line-height:1.75;font-weight:600}
.tcard .tf{background:#F6F3EC;padding:14px 22px;font-size:.6em;color:var(--ink3);line-height:1.7;
  border-top:1px solid var(--line)}
#cvwrap img{width:100%;border-radius:16px;border:1px solid var(--line);display:block}

/* ---------- 金句記憶 ---------- */
.mv{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;text-align:center;margin:0 0 14px}
.mv .mref{font-size:.66em;letter-spacing:.2em;color:var(--accent);font-weight:700;margin:0 0 16px}
.mv .mtext{font-family:var(--serif);font-size:1.12em;line-height:2;margin:0}
.mv .mtext i{font-style:normal;color:var(--p3);opacity:.55}
.mv .mprog{font-size:.6em;letter-spacing:.14em;color:var(--ink3);margin:18px 0 0}

/* ---------- 畫線 ---------- */
mark.hl{background:linear-gradient(transparent 58%,rgba(201,162,39,.42) 58%);color:inherit;
  padding:0 1px;border-radius:2px;cursor:pointer}
mark.hl.n{background:linear-gradient(transparent 58%,rgba(90,140,200,.38) 58%)}
mark.hl.n::after{content:"✎";font-size:.62em;color:var(--p1);vertical-align:super;margin-left:2px}
#selbar{position:fixed;z-index:70;display:none;background:#20242B;border-radius:14px;padding:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);gap:2px}
#selbar.on{display:flex}
#selbar button{color:#fff;font-size:.62em;padding:10px 12px;border-radius:10px;white-space:nowrap;letter-spacing:.06em}
#selbar button:active{background:#333A45}

/* ---------- 錄音 ---------- */
.rec{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin:0 0 8px}
.rec .rt{flex:1;min-width:0;font-size:.72em;color:var(--ink3)}
.rec audio{width:100%;height:38px}
.recdot{width:12px;height:12px;border-radius:50%;background:#C0392B;flex:none;animation:bl 1.1s infinite}
@keyframes bl{50%{opacity:.25}}

/* ---------- AI 小智 ---------- */
#aibtn{position:fixed;right:16px;bottom:calc(96px + var(--safe-b));z-index:60;width:60px;height:60px;
  border-radius:50%;background:var(--p1);color:#fff;font-family:var(--serif);font-size:1.05em;font-weight:700;
  box-shadow:0 8px 22px rgba(30,58,95,.35);display:grid;place-items:center}
#ai{position:fixed;inset:0;z-index:85;background:rgba(20,24,30,.42);display:none;align-items:flex-end;justify-content:center}
#ai.on{display:flex}
#ai .box{background:var(--bg);width:100%;max-width:760px;height:86vh;display:flex;flex-direction:column;
  border-radius:22px 22px 0 0;overflow:hidden}
#ai .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
#ai .hd b{font-family:var(--serif);font-size:.92em;flex:1}
#ai .hd small{font-size:.58em;color:var(--ink3);letter-spacing:.1em}
#ai .msgs{flex:1;overflow-y:auto;padding:16px 18px}
#ai .m{margin:0 0 14px;font-size:.84em;line-height:1.85}
#ai .m.u{text-align:right}
#ai .m.u span{display:inline-block;background:var(--p1);color:#fff;padding:11px 15px;border-radius:16px 16px 4px 16px;max-width:86%;text-align:left}
#ai .m.a span{display:inline-block;background:var(--card);border:1px solid var(--line);padding:13px 16px;
  border-radius:16px 16px 16px 4px;max-width:94%}
#ai .quick{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 0}
#ai .quick button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:9px 15px;font-size:.66em;white-space:nowrap}
#ai .inp{display:flex;gap:8px;padding:12px 18px calc(14px + var(--safe-b));border-top:1px solid var(--line);background:var(--card)}
#ai .inp input{flex:1;font-size:.8em}
#ai .inp button{background:var(--p1);color:#fff;border-radius:14px;padding:0 18px;font-size:.76em}
#ai .note{font-size:.62em;color:var(--ink3);line-height:1.7;padding:8px 18px 0}
#ai .spk{margin-top:8px;font-size:.6em;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:5px 12px}

/* ---------- 啟動畫面 ---------- */
#boot{position:fixed;inset:0;z-index:120;background:#174238;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#boot img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#boot b{font-family:var(--serif);color:#F2E3B8;font-size:1.05em;letter-spacing:.14em;font-weight:700}
#boot small{color:rgba(242,227,184,.62);font-size:.6em;letter-spacing:.2em}
#boot.off{opacity:0;pointer-events:none}

hr.sep{border:0;border-top:1px solid var(--line);margin:26px 0}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--p3);outline-offset:2px}
</style>
</head>
<body>

<div id="boot">
  <img src="logo.png" alt="321系統神學" width="132" height="132">
  <b>321系統神學</b>
  <small>三部十九課　·　國度321空中團契</small>
</div>

<header class="top">
  <div class="wrap">
    <button class="iconbtn hide" id="back" aria-label="返回">‹</button>
    <h1 id="ttl">321系統神學</h1>
    <button class="iconbtn" id="speak" aria-label="朗讀">🔊</button>
    <button class="iconbtn" id="fsz" aria-label="字級">Ａ</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><b>今</b>今日</button>
  <button data-tab="courses"><b>課</b>課程</button>
  <button data-tab="tools"><b>工</b>工具</button>
  <button data-tab="me"><b>我</b>我的</button>
</nav>

<div id="selbar">
  <button id="sbHL">畫線</button><button id="sbNote">畫線＋筆記</button>
  <button id="sbSpeak">朗讀</button><button id="sbAsk">問小智</button>
</div>

<button id="aibtn" aria-label="AI 小智">智</button>
<div id="ai"><div class="box">
  <div class="hd"><b>小智</b><small id="aictx"></small>
    <button class="iconbtn" id="aiclear" aria-label="清除">↺</button>
    <button class="iconbtn" id="aiclose" aria-label="關閉">✕</button></div>
  <div class="msgs" id="aimsgs"></div>
  <div class="quick" id="aiquick"></div>
  <p class="note">小智是陪讀的小幫手，不是聖靈，也不能代替牧者與屬靈同伴。</p>
  <div class="inp"><input type="text" id="aiin" placeholder="問一個問題…" autocomplete="off">
    <button id="aisend">送出</button></div>
</div></div>

<div class="sheet" id="sheet"><div class="inner"><div class="grab"></div><div id="sheetbody"></div></div></div>

<div class="live" id="live">
  <div class="lvbar"><i id="lvbar" style="width:0"></i></div>
  <div class="lvbody" id="lvbody"></div>
  <div class="lvfoot">
    <span class="clock" id="lvclock">10:00</span>
    <button class="btn" id="lvtoggle">暫停</button>
    <button class="btn" id="lvnext" style="flex:1;text-align:center">下一段</button>
    <button class="btn" id="lvexit">結束</button>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== 設定 ===== */
const CFG = {
  aiEndpoint : 'https://xiaozhi-proxy.spch321.workers.dev',
  aiModel    : 'claude-sonnet-4-6',
  ttsEndpoint: 'https://azure-tts.spch321.workers.dev',
  ttsVoices  : {
    yunjhe  : { name:'zh-TW-YunJheNeural',                  label:'雲哲', desc:'溫潤親切男聲' },
    yunfan  : { name:'zh-CN-Yunfan:DragonHDLatestNeural',   label:'雲帆', desc:'高清男聲' },
    xiaochen: { name:'zh-CN-Xiaochen:DragonHDLatestNeural', label:'曉辰', desc:'高清女聲' }
  }
};

/* ===== IndexedDB（語音快取與錄音） ===== */
const IDB_NAME = 'g321theo';
let _db = null;
function db(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(0);
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => { const d = r.result;
      if (!d.objectStoreNames.contains('audio')) d.createObjectStore('audio');
      if (!d.objectStoreNames.contains('rec'))   d.createObjectStore('rec'); };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(0);
  });
}
const idbGet = (st,k) => db().then(d => new Promise((res,rej) => {
  const r = d.transaction(st,'readonly').objectStore(st).get(k);

const idbPut = (st,k,v) => db().then(d => new Promise((res,rej) => {

const idbDel = (st,k) => db().then(d => new Promise(res => {

const idbKeys = st => db().then(d => new Promise(res => {

function memAdd(id, silent){
  const m = mem();
  if (m[id]) return false;
  m[id] = { box:0, due: Date.now(), hits:0 }; save();
  if (!silent) toast('已加入複習');

function memGrade(id, ok){
  const m = mem(), r = m[id]; if (!r) return;
  r.box = ok ? Math.min(GAPS.length - 1, r.box + 1) : Math.max(0, r.box - 1);
  r.hits = (r.hits||0) + (ok ? 1 : 0);
  r.due = Date.now() + (ok ? GAPS[r.box] : 1) * DAY;
  save();
}
// 遮字：依日期固定，同一天看到的空格一樣
function blank(text, seed){
  const chars = [...text];
  const idx = chars.map((c,i) => /[\u4e00-\u9fa5]/.test(c) ? i : -1).filter(i => i >= 0);
  let r = seed;
  const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * .32));
  const pick = new Set();
  while (pick.size < n && pick.size < idx.length) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return chars.map((c,i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

function ring(id, big){
  const st = (S.progress[id] || {}).steps || [];
  const done = st.length, C = big ? 50 : 18, R = big ? 9 : 5;
  const c = 2 * Math.PI * (C - R/2 - 1), seg = c/8, gap = big ? 5 : 3;
  let s = `<svg class="${big?'ringbig':'ring'}" viewBox="0 0 ${C*2} ${C*2}">`;
  for (let i = 0; i < 8; i++){
    const on = st.includes(i);
    s += `<circle cx="${C}" cy="${C}" r="${C-R/2-1}" stroke="${on?'currentColor':'#E4DFD4'}"
      stroke-dasharray="${seg-gap} ${c-seg+gap}" stroke-dashoffset="${-i*seg}"
      transform="rotate(-90 ${C} ${C})" stroke-linecap="round"/>`;
  }
  if (big) s += `<text x="${C}" y="${C+6}" text-anchor="middle" font-size="26" font-family="serif" fill="currentColor">${done}/8</text>`;
  return s + '</svg>';
}

                who:'第8步 繁殖｜你要講給誰聽？寫下名字。' }[need];
    const v = prompt(q, p[need] || '');
    if (!v || !v.trim()) return;
    p[need] = v.trim();
    if (need === 'who'){ p.whoAt = Date.now(); p.told = 0; p.nudge = 0; }

  p.steps = [...new Set([...p.steps, i])].sort((a,b)=>a-b);

  save(); renderLesson(CACHE[id]);

/* ===== 朗讀：真人語音（Azure）＋ 系統語音備援 ===== */
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
const rv = { audio:null, url:{}, unlocked:false, queue:[], token:0, active:false, onDone:null };
const rvOn = () => /^https?:\/\//i.test(CFG.ttsEndpoint || '');
function rvAudio(){
  if (!rv.audio){
    rv.audio = new Audio(); rv.audio.preload = 'auto';
    try { rv.audio.playsInline = true; rv.audio.setAttribute('playsinline',''); 
          rv.audio.setAttribute('webkit-playsinline',''); } catch(e){}
  }
  return rv.audio;
}
// iOS 必須在使用者手勢中先播一段無聲，之後才准許程式播放
function rvUnlock(){
  if (rv.unlocked) return;
  try { const a = rvAudio(); a.loop = false; a.src = SILENT;
    const p = a.play();
    if (p && p.then) p.then(() => { rv.unlocked = true; try { a.pause(); } catch(e){} }).catch(()=>{});
    else rv.unlocked = true;
  } catch(e){}
}
const rvVoice = () => (CFG.ttsVoices[S.settings.voice] || CFG.ttsVoices.yunjhe).name;
const rvRate  = () => { const pct = Math.round(((S.settings.rate || 1) - 1) * 100);
                        return (pct >= 0 ? '+' : '') + pct + '%'; };
// 依標點切句，每段 100–300 字：唸起來自然，請求也不會太碎
function rvChunks(text){
  const t = String(text||'').replace(/\s+/g,' ').trim(); if (!t) return [];
  const end = '。！？；\n'; const out = []; let buf = '';
  for (const ch of t){ buf += ch; if (end.includes(ch) && buf.length >= 100){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  const fin = [];
  out.forEach(seg => { while (seg.length > 300){ fin.push(seg.slice(0,300)); seg = seg.slice(300); }
                       if (seg) fin.push(seg); });
  return fin.length ? fin : [t];
}
async function rvPiece(piece){
  const key = rvVoice() + '|' + rvRate() + '|' + piece;
  if (rv.url[key]) return rv.url[key];
  try { const b = await idbGet('audio', key);
    if (b){ const u = URL.createObjectURL(b); rv.url[key] = u; return u; } } catch(e){}
  const res = await fetch(CFG.ttsEndpoint, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ voice: rvVoice(), rate: rvRate(), sil:140, silc:140, sile:260, text: piece }) });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  try { idbPut('audio', key, blob); } catch(e){}
  const u = URL.createObjectURL(blob); rv.url[key] = u; return u;
}
function rvStop(){
  rv.token++; rv.active = false; rv.queue = [];
  if (rv.audio){ try { rv.audio.pause(); } catch(e){} rv.audio.onended = null; rv.audio.onerror = null; }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = 'none'; } catch(e){}
}
// 任何一段抓不到，就用系統語音把那一段補上，絕不中斷
function sysChunk(piece, cb){
  if (!('speechSynthesis' in window)) return cb && cb();
  try { const u = new SpeechSynthesisUtterance(piece);
    u.lang = 'zh-TW'; u.rate = 0.95 * (S.settings.rate || 1);
    u.onend = cb; u.onerror = cb; speechSynthesis.speak(u);
  } catch(e){ cb && cb(); }
}
function rvSpeak(text, onDone){
  rvUnlock();
  const q = rvChunks(text);
  if (!q.length) return onDone && onDone();
  rv.queue = q; rv.active = true; rv.onDone = onDone || null;
  const my = ++rv.token, a = rvAudio();
  try { if (navigator.mediaSession){
    navigator.mediaSession.metadata = new MediaMetadata({ title:'321系統神學' });
    navigator.mediaSession.playbackState = 'playing'; } } catch(e){}
  const at = i => {
    if (my !== rv.token) return;
    if (i >= q.length){ rvStop(); speakMark(false); rv.onDone && rv.onDone(); return; }
    rvPiece(q[i]).then(url => {
      if (my !== rv.token) return;
      a.onended = null; a.onerror = null; a.src = url;
      a.onended = () => { if (my === rv.token) at(i+1); };
      a.onerror = () => sysChunk(q[i], () => { if (my === rv.token) at(i+1); });
      const p = a.play();
      if (p && p.catch) p.catch(() => sysChunk(q[i], () => { if (my === rv.token) at(i+1); }));
      if (q[i+1]) rvPiece(q[i+1]).catch(()=>{});
    }).catch(() => sysChunk(q[i], () => { if (my === rv.token) at(i+1); }));
  };
  at(0);
}

function say(text){
  if (!text || !text.trim()) return;
  rvStop(); speakMark(true);
  if (rvOn()) return rvSpeak(text, () => speakMark(false));
  if (!('speechSynthesis' in window)){ speakMark(false); return alert('這台裝置不支援朗讀。'); }
  const u = new SpeechSynthesisUtterance(text.slice(0, 6000));
  u.lang = 'zh-TW'; u.rate = 0.92 * (S.settings.rate || 1);
  u.onend = u.onerror = () => speakMark(false);

let LIVE = null;
async function startLive(id){
  const L = await getLesson(id);
  const div = document.createElement('div'); div.innerHTML = L.views.live4;
  const parts = [];
  div.querySelectorAll('p, .pp').forEach(p => {
    const t = p.innerText.trim(); if (!t) return;
    const m = t.match(/^([①②③④])\s*(.+?)（(\d+)分鐘?）([\s\S]*)$/);
    if (m) parts.push({ title: m[2], min:+m[3], body: m[4].trim(), note:'' });
    else if (parts.length){
      if (/^帶領提醒/.test(t)) parts[parts.length-1].note += t;
      else parts[parts.length-1].body += '\n' + t;
    }
  });
  if (!parts.length) return alert('本課的小組本尚未提供可帶領的段落。');
  // 討論段落：一題一頁
  const slides = [];
  parts.forEach(p => {
    const qs = /討論|實作|五題/.test(p.title) ? p.body.split(/\s(?=[1-5]\.\s)/).filter(x => /^[1-5]\.\s/.test(x)) : [];
    if (qs.length >= 3){
      const lead = p.body.split(/\s(?=1\.\s)/)[0];
      const per = Math.max(1, Math.round(p.min / qs.length));
      qs.forEach((q, k) => slides.push({
        title: p.title + '　' + (k+1) + '/' + qs.length, min: per,
        body: (k === 0 && lead && !/^1\./.test(lead) ? lead + '\n\n' : '') + q,
        note: k === qs.length-1 ? p.note : ''
      }));
    } else slides.push(p);
  });
  LIVE = { parts: slides, i:0, left: slides[0].min*60, run:true, total: slides.reduce((a,b)=>a+b.min*60,0), id };
  $('#live').classList.add('on'); drawLive(); tick();
}
function drawLive(){
  const p = LIVE.parts[LIVE.i];
  $('#lvbody').innerHTML = `<div style="font-size:.5em;letter-spacing:.24em;opacity:.6;margin-bottom:14px">
      ${LIVE.i+1} / ${LIVE.parts.length}　${esc(p.title)}</div>
    <div>${esc(p.body).replace(/\n/g,'<br><br>')}</div>
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}`;
  $('#lvnext').textContent = LIVE.i < LIVE.parts.length-1 ? '下一段 ›' : '完成';
  $('#lvbody').scrollTop = 0;
}
let LT = null;
function tick(){
  clearInterval(LT);
  LT = setInterval(() => {
    if (!LIVE || !LIVE.run) return;
    LIVE.left--;
    const m = Math.max(0, Math.floor(LIVE.left/60)), s = Math.max(0, LIVE.left%60);
    $('#lvclock').textContent = m + ':' + String(s).padStart(2,'0');
    const done = LIVE.parts.slice(0,LIVE.i).reduce((a,b)=>a+b.min*60,0) + (LIVE.parts[LIVE.i].min*60 - LIVE.left);
    $('#lvbar').style.width = Math.min(100, done/LIVE.total*100) + '%';
  }, 1000);
}

  const out = []; let line = '';
  for (const ch of text){
    if (ch === '\n'){ out.push(line); line = ''; continue; }
    if (ctx.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}

/* ===== 畫線與註記 ===== */
const marks = id => (S.marks[id] = S.marks[id] || []);
const flatten = t => String(t||'').replace(/\s+/g, '');

// 建立「去空白字元 → 文字節點座標」的對照表，讓畫線可以跨越粗體、連結等標籤
function flatIndex(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const map = []; let n, flat = '';
  while ((n = w.nextNode())){
    const t = n.nodeValue;
    for (let i = 0; i < t.length; i++){
      if (!/\s/.test(t[i])){ map.push([n, i]); flat += t[i]; }
    }
  }
  return { map, flat };
}
function wrapSpan(map, from, to, cls, idx){
  const groups = [];
  for (let k = from; k <= to; k++){
    const [node, off] = map[k];
    const g = groups[groups.length - 1];
    if (g && g.node === node && off === g.end + 1) g.end = off;
    else groups.push({ node, start: off, end: off });
  }
  groups.reverse().forEach(g => {
    try {
      if (g.node.parentNode && g.node.parentNode.nodeName === 'MARK') return;
      const tail = g.node.splitText(g.start);
      if (tail.nodeValue.length > g.end - g.start + 1) tail.splitText(g.end - g.start + 1);
      const mk = document.createElement('mark');
      mk.className = cls; mk.dataset.i = idx; mk.textContent = tail.nodeValue;
      tail.parentNode.replaceChild(mk, tail);
      mk.onclick = e => { e.stopPropagation(); markMenu(idx); };
    } catch(e){}
  });
}
function applyMarks(){
  const root = $('#lbody'); if (!root) return;
  const ms = S.marks[CUR.lesson] || []; if (!ms.length) return;
  ms.forEach((m, i) => {
    const q = m.f || flatten(m.q); if (q.length < 2) return;
    let guard = 0;
    while (guard++ < 20){
      const { map, flat } = flatIndex(root);
      const at = flat.indexOf(q);
      if (at < 0) break;
      // 已經包在 mark 裡就不重複處理
      if (map[at][0].parentNode && map[at][0].parentNode.nodeName === 'MARK') break;
      wrapSpan(map, at, at + q.length - 1, 'hl' + (m.note ? ' n' : ''), i);
      break;
    }
  });
}
function markMenu(i){
  const m = marks(CUR.lesson)[i]; if (!m) return;
  sheet(`<p class="eyebrow">我畫的線</p>
    <div class="card" style="background:#F6F3EC"><p style="margin:0;font-size:.9em;line-height:1.8">${esc(m.q)}</p></div>
    <p class="eyebrow">我的註記</p>

function addMark(q, withNote){

let REC = null, RECT = null;
async function recStart(id){
  if (!navigator.mediaDevices || !window.MediaRecorder) return alert('這台裝置或瀏覽器不支援錄音。');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mime = ['audio/mp4','audio/webm;codecs=opus','audio/webm']
      .find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const parts = [];
    mr.ondataavailable = e => e.data.size && parts.push(e.data);
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(parts, { type: mime || 'audio/webm' });
      await idbPut('rec', id + '|' + Date.now(), blob);
      REC = null; clearInterval(RECT);
      renderLesson(CACHE[id]); toast('錄音已存');
    };
    mr.start();
    REC = { mr, id, t0: Date.now() };
    renderLesson(CACHE[id]);
    RECT = setInterval(() => { const e = $('#recclock'); if (e)
      e.textContent = Math.floor((Date.now() - REC.t0)/1000) + ' 秒'; }, 500);
  } catch(e){ alert('無法使用麥克風。請確認已允許錄音權限。'); }
}
function recStop(){ if (REC) try { REC.mr.stop(); } catch(e){} }
async function recList(id){
  const ks = (await idbKeys('rec')).filter(k => String(k).startsWith(id + '|'));
  const host = $('#reclist'); if (!host) return;
  if (!ks.length){ host.innerHTML = ''; return; }
  host.innerHTML = ks.sort().reverse().map(k => {
    const d = new Date(+String(k).split('|')[1]);
    return `<div class="rec"><span class="rt">${d.getMonth()+1}/${d.getDate()}　${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span>
      <button class="btn" onclick="recPlay('${k}',this)">播放</button>
      <button class="btn" onclick="recDel('${k}')">刪除</button></div>`;
  }).join('');
}
async function recPlay(k, btn){
  const b = await idbGet('rec', k); if (!b) return;
  const wrap = btn.parentNode;
  if (wrap.querySelector('audio')) return;
  const a = document.createElement('audio'); a.controls = true; a.src = URL.createObjectURL(b);
  wrap.style.flexWrap = 'wrap'; wrap.appendChild(a); a.play();
}

    '核心生命：無己、謙卑勝過驕傲、用心靠聖靈不用腦靠自己、先生命再關係後事工。',
    '但要記得：321 本身是 C 層的工具，不是聖經。教材自己列出了 321 需要被聖經修正的地方，你也可以誠實指出來。',
    '',
    '【語言與風格】一律用繁體中文回答，引用聖經一律使用《和合本》。',
    '只在你有把握時引用經文，絕不杜撰經文或出處；不確定就如實說明，請對方自行查考。',
    '深入淺出、善用比喻、條理清晰、溫暖有盼望。回應精簡，通常二、三段內。',
    '不要使用 Markdown 語法（不用井號標題、不用星號粗體、不用表格），用自然段落文字即可。',
    '',
    '【安全】只在信仰、聖經、神學、屬靈成長、品格與生活應用、為人禱告、鼓勵造就的範圍內服事。不論斷人、不捲入政治爭論。',
    '',
    '【每則回答的結尾】請固定另起一段，寫上這一句：「我可能會錯。請你自己回到聖經查考（徒17:11）。」'
  ];
  const c = aiContext();
  if (c) L.push('', '【對方正在讀這一課，請緊扣課文陪他】', c);
  return L.join('\n');
}
function aiOpen(pre){
  if (!aiOn()) return toast('AI 尚未設定');
  $('#ai').classList.add('on');
  $('#aictx').textContent = CUR.lesson ? '第' + meta(CUR.lesson).number + '課' : '';
  aiRender();
  if (pre){ $('#aiin').value = ''; aiSend(pre); }
}
function askAI(q){ aiOpen(q); }
function aiRender(){
  const box = $('#aimsgs');
  box.innerHTML = AI.msgs.length ? AI.msgs.map((m, i) =>
    `<div class="m ${m.role === 'user' ? 'u' : 'a'}"><span>${esc(m.text).replace(/\n/g,'<br>')}
      ${m.role === 'assistant' ? `<br><button class="spk" onclick="say(${JSON.stringify(JSON.stringify(m.text))})">朗讀</button>` : ''}
    </span></div>`).join('')
    : `<div class="m a"><span>平安！我是小智。<br><br>你可以問我這一課的內容，或任何關於聖經與 321 的問題。<br><br>我會告訴你答案的依據在哪一課、哪一節經文，也會標明那是聖經明說的，還是我們的整理。</span></div>`;
  if (AI.busy) box.insertAdjacentHTML('beforeend', '<div class="m a"><span>小智正在想…</span></div>');
  box.scrollTop = box.scrollHeight;
  $('#aiquick').innerHTML = aiQuicks().map(q =>
    `<button onclick="aiSend(${JSON.stringify(JSON.stringify(q))})">${esc(q)}</button>`).join('');
}
async function aiSend(text){
  const q = (text != null ? text : $('#aiin').value).trim();
  if (!q || AI.busy) return;
  $('#aiin').value = '';
  AI.msgs.push({ role:'user', text:q }); AI.busy = true; aiRender();
  if (navigator.onLine === false){
    AI.msgs.push({ role:'assistant', text:'現在沒有網路，小智暫時無法回應。課文與金句都還可以離線使用。' });
    AI.busy = false; return aiRender();
  }
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch(e){} }, 45000) : null;
  try {
    const res = await fetch(CFG.aiEndpoint, {
      method:'POST', headers:{'Content-Type':'application/json'}, signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({ model: CFG.aiModel, max_tokens: 1000, system: aiSystem(),
        messages: AI.msgs.slice(-12).map(m => ({ role:m.role, content:m.text })) })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    const t = (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
    AI.msgs.push({ role:'assistant', text: t || '小智這次沒有回應內容，請再問一次。' });
  } catch(e){
    AI.msgs.push({ role:'assistant', text: (e && e.name === 'AbortError')
      ? '等太久了，請再試一次。' : '連線出了狀況，請稍後再試。' });
  } finally { if (timer) clearTimeout(timer); }
  AI.busy = false; aiRender();
}
$('#aibtn').onclick   = () => aiOpen();
$('#aiclose').onclick = () => $('#ai').classList.remove('on');
$('#aiclear').onclick = () => { AI.msgs = []; aiRender(); };
$('#aisend').onclick  = () => aiSend();
$('#aiin').onkeydown  = e => { if (e.key === 'Enter') aiSend(); };
$('#ai').onclick = e => { if (e.target.id === 'ai') $('#ai').classList.remove('on'); };

/* ===== 提示 ===== */
let TT = null;
function toast(msg){
  let t = $('#toast');
  if (!t){ t = el('<div id="toast" style="position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:#20242B;color:#fff;padding:12px 20px;border-radius:999px;font-size:.7em;z-index:99;letter-spacing:.08em"></div>'); document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(TT); TT = setTimeout(() => t.style.opacity = 0, 1600);
}

boot();
